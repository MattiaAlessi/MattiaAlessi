<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="100%" role="img" aria-label="footer wave">
  <defs>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- faint decorative symbols -->
  <text x="60" y="40" font-family="'Fira Code', Consolas, monospace" font-size="34" fill="#38bdf8" opacity="0.10">$</text>
  <text x="920" y="46" font-family="'Fira Code', Consolas, monospace" font-size="44" fill="#60a5fa" opacity="0.10">_</text>

  <!-- floating particles -->
  <circle cx="180" cy="52" r="2.4" fill="#38bdf8" opacity="0.4">
    <animate attributeName="cy" values="52;38;52" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="60" r="2" fill="#60a5fa" opacity="0.35">
    <animate attributeName="cy" values="60;44;60" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="48" r="2.6" fill="#38bdf8" opacity="0.4">
    <animate attributeName="cy" values="48;32;48" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- back wave (lighter) -->
  <path d="M0,72 C125,44 250,92 375,72 C500,52 625,92 750,72 C875,52 950,76 1000,66 L1000,140 L0,140 Z" fill="#60a5fa" opacity="0.35"/>
  <!-- front wave (gradient) -->
  <path d="M0,98 C125,72 250,112 375,96 C500,80 625,114 750,98 C875,82 950,102 1000,94 L1000,140 L0,140 Z" fill="url(#waveGrad)"/>
</svg>
